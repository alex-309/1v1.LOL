<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mannequin character — blue / red</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #f4f3f0; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  #team {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    display: flex; gap: 8px; font: 500 13px/1 ui-sans-serif, Helvetica, system-ui, sans-serif;
  }
  #team button {
    padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(0,0,0,.14);
    background: rgba(255,255,255,.85); color: #1a1a1a; cursor: pointer;
    letter-spacing: .02em; backdrop-filter: blur(6px);
  }
  #team button[aria-pressed="true"] { color: #fff; border-color: transparent; }
  #team button[data-team="blue"][aria-pressed="true"] { background: #2f6fd0; }
  #team button[data-team="red"][aria-pressed="true"] { background: #cf3b34; }
</style>
</head>
<body>
<div id="team">
  <button type="button" data-team="blue" aria-pressed="true">Player (blue)</button>
  <button type="button" data-team="red" aria-pressed="false">Enemy (red)</button>
</div>
<three-d-stage name="mannequin-blue" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
  import { buildMannequin, PALETTES } from './mannequin.js';
  const stage = document.querySelector('three-d-stage');
  await stage.ready;

  const models = { blue: buildMannequin(PALETTES.blue), red: buildMannequin(PALETTES.red) };
  const show = team => {
    stage.setAttribute('name', 'mannequin-' + team);
    stage.setObject(models[team]);
    document.querySelectorAll('#team button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.team === team)));
  };
  document.querySelectorAll('#team button').forEach(b =>
    b.addEventListener('click', () => show(b.dataset.team)));
  show('blue');
</script>
</body>
</html>
